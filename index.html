<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="الندى لنقل العفش - خدمات احترافية وآمنة لنقل الأثاث">
  <title>الندى لنقل العفش</title>
  <style>
    :root {
      --ink: #151515;
      --muted: #3f3f3f;
      --button: #e6e6e8;
      --button-hover: #dcdcdf;
      --gold: #c89a33;
      --blue: #0b3f72;
      --page-width: 680px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: #bdbdbd;
      font-family: Tahoma, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      width: min(100%, var(--page-width));
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .topbar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: ltr;
    }

    .spark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      font-size: 25px;
      line-height: 1;
      font-weight: 700;
      transform: translateY(-1px);
    }

    .share {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      padding: 0;
      color: #252525;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .share:hover { background: #f0f0f0; }
    .share:active { transform: scale(.92); }
    .share svg { width: 21px; height: 21px; }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px 0 27px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin-bottom: 13px;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 1px 7px rgba(0, 0, 0, .13);
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.35;
      font-weight: 700;
    }

    .description {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: #242424;
    }

    .links {
      width: 100%;
      display: grid;
      gap: 11px;
    }

    .link {
      min-height: 58px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 55px 8px 55px;
      color: #222;
      background: var(--button);
      border-radius: 999px;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .link:hover {
      background: var(--button-hover);
      box-shadow: 0 3px 9px rgba(0, 0, 0, .08);
      transform: translateY(-1px);
    }

    .link:active { transform: translateY(0) scale(.99); }

    .link-icon {
      width: 40px;
      height: 40px;
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      border: 2px solid rgba(200, 154, 51, .45);
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
    }

    .more {
      width: 16px;
      height: 25px;
      position: absolute;
      left: 14px;
      top: 50%;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      color: #777;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: auto;
      padding-top: 52px;
      text-align: center;
      color: #222;
      font-size: 10px;
      line-height: 1.8;
    }

    .footer a {
      text-decoration: none;
    }

    .footer .brand {
      width: max-content;
      margin: 9px auto 6px;
      padding: 7px 15px;
      border-radius: 999px;
      color: #fff;
      background: #111;
      font-size: 11px;
      font-weight: 700;
    }

    .footer strong {
      display: block;
      font-size: 11px;
      font-weight: 400;
    }

    .toast {
      position: fixed;
      z-index: 10;
      right: 50%;
      bottom: 24px;
      padding: 10px 15px;
      border-radius: 10px;
      color: #fff;
      background: rgba(20, 20, 20, .9);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(50%, 12px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(50%, 0);
    }

    @media (max-width: 680px) {
      body { background: #fff; }
      .page { padding-top: max(18px, env(safe-area-inset-top)); }
    }

    @media (min-width: 681px) {
      .page { box-shadow: 0 0 28px rgba(0, 0, 0, .12); }
    }
  </style>
</head>
<body>

        </svg>

    </header>

    <section class="profile" aria-label="الملف التعريفي">
      <img
        class="avatar"
        src="https://ugc.production.linktr.ee/f5522771-eaf1-40ed-be3a-9acd83a704b1_ChatGPT-Image-Sep-21--2026--01-09-00-PM.png?io=true&amp;size=avatar-v3_0"
        alt="شعار الندى لنقل العفش"
      >

    <nav class="links" aria-label="طرق التواصل">

        <img class="link-icon" src="https://ugc.production.linktr.ee/f5522771-eaf1-40ed-be3a-9acd83a704b1_ChatGPT-Image-Sep-21--2026--01-09-00-PM.png?io=true&amp;size=thumbnail-stack_v1_0" alt="">
        <span>اتصل الآن</span>

      <a class="link" href="https://wa.me/966534514829?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D8%AE%D8%AF%D9%85%D8%A9%20%D9%86%D9%82%D9%84%20%D8%A7%D9%84%D8%B9%D9%81%D8%B4" target="_blank" rel="noopener noreferrer" aria-label="تواصل معنا عبر الواتساب">
        <img class="link-icon" src="https://ugc.production.linktr.ee/f5522771-eaf1-40ed-be3a-9acd83a704b1_ChatGPT-Image-Sep-21--2026--01-09-00-PM.png?io=true&amp;size=thumbnail-stack_v1_0" alt="">

    </nav>

    <footer class="footer">
      <span>الخصوصية&nbsp; · &nbsp;عن الحساب&nbsp; · &nbsp;مشاركة الصفحة</span>
      <div class="brand">الندى لنقل العفش</div>
      <strong>تواصل مع الندى لنقل العفش</strong>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const shareButton = document.getElementById('shareButton');
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    shareButton.addEventListener('click', async () => {
      const shareData = {
        title: 'الندى لنقل العفش',
        text: 'خدمات احترافية وآمنة لنقل الأثاث',
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }

      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast('تم نسخ رابط الصفحة');
      } catch (error) {
        showToast('انسخ رابط الصفحة من شريط المتصفح');
      }
    });
  </script>
</body>
</html>
